<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Streaming-web-app Banner</title>
  <desc id="desc">A modern banner for the streaming platform with auth, media processing, notifications, payments, and background jobs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="90" x2="1340" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1600" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="shadow" x="0" y="0" width="1600" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="32" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="220" cy="120" r="110" fill="#22D3EE" fill-opacity="0.32"/>
    <circle cx="1410" cy="95" r="125" fill="#A78BFA" fill-opacity="0.28"/>
    <circle cx="1240" cy="330" r="150" fill="#FB7185" fill-opacity="0.18"/>
  </g>
  <rect x="78" y="60" width="1444" height="300" rx="28" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
  <rect x="120" y="105" width="120" height="120" rx="28" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.18"/>
  <path d="M165 141C182 141 196 155 196 172C196 189 182 203 165 203C148 203 134 189 134 172C134 155 148 141 165 141Z" fill="#F8FAFC"/>
  <path d="M145 172L157 184L186 156" stroke="#22D3EE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="280" y="155" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">STREAMING WEB APP</text>
  <text x="280" y="230" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800">Secure Streaming Platform</text>
  <text x="280" y="285" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Auth • Media Processing • Notifications • Payments • Celery Workers</text>

  <g filter="url(#shadow)">
    <rect x="1060" y="120" width="420" height="160" rx="26" fill="#0F172A" fill-opacity="0.52" stroke="#E2E8F0" stroke-opacity="0.12"/>
    <rect x="1090" y="150" width="160" height="44" rx="22" fill="#1D4ED8"/>
    <text x="1170" y="179" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">JWT Auth</text>

    <rect x="1260" y="150" width="190" height="44" rx="22" fill="#7C3AED"/>
    <text x="1355" y="179" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Cloud Media</text>

    <rect x="1090" y="214" width="150" height="44" rx="22" fill="#0EA5E9"/>
    <text x="1165" y="243" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Celery</text>

    <rect x="1250" y="214" width="200" height="44" rx="22" fill="#F97316"/>
    <text x="1350" y="243" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Payments + Push</text>
  </g>

  <path d="M0 350C180 300 360 390 540 350C720 310 900 260 1080 300C1260 340 1420 310 1600 270V420H0V350Z" fill="url(#accent)"/>
</svg>
