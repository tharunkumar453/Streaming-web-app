name: Celery Worker Video CI
on:

  push:
    branches: [ "dev" ]
    paths:
      - 'CeleryConsumer/**'
      - '.github/workflows/celery-worker-video.yml'
jobs:
  build-celery-worker-video-CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./CeleryConsumer
          file: ./CeleryConsumer/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/celeryconsumervideo:${{ github.sha }}