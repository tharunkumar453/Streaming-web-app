  name: Auth CI
  on:
    push:
      branches: [ "dev" ]
      paths:
        - 'my_project_auth/**'
        - '.github/workflows/Auth.yml'
        
        
  jobs:
    build-auth-CI:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        
        - name: Log in to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
            context: ./my_project_auth
            file: ./my_project_auth/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/my_project_auth:${{ github.sha }}

        - name: Checkout GitOps Repository
          uses: actions/checkout@v4
          with:
            repository: ${{ secrets.GITOPS_REPO }}
            token: ${{ secrets.GITOPS_TOKEN }}
            path: k8s-files

            
        - name: Update deployment.yaml
          run: |
            sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/my_project_auth:${{ github.sha }}|" \
            k8s-files/my_project_auth.yml
        - name: Commit and Push
          run: |
            cd k8s-files

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add .
            git commit -m "Update image tag" || echo "No changes"
            git push 

          

